<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#d61d2c" />
  <title>Page introuvable | Le Comptoir des Étuves</title>
  <style>
    body{overflow-x:clip}main{min-width:0}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#d61d2c;color:#fff;font-family:Arial,sans-serif;background-image:radial-gradient(#ffffff14 2px,transparent 2px);background-size:26px 26px}main{width:min(100%,680px);text-align:center}.brand{font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.stamp{display:grid;place-items:center;margin:32px auto;width:clamp(170px,50vw,280px);aspect-ratio:1;border:8px solid #fff;border-radius:50%;box-shadow:0 0 0 6px #d61d2c,0 0 0 10px #fff;transform:rotate(-8deg);font-family:Impact,Arial,sans-serif;font-size:clamp(75px,24vw,135px);line-height:1}h1{font-family:Impact,Arial,sans-serif;font-weight:400;font-size:clamp(34px,8vw,64px);line-height:1.1;text-transform:uppercase;margin:24px 0 12px}p{line-height:1.6}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}.actions a{display:inline-block;min-height:48px;border:2px solid #fff;border-radius:999px;padding:14px 22px;color:#fff;text-decoration:none;font-weight:800}.actions a:first-child{background:#fff;color:#d61d2c}.actions a:focus-visible{outline:4px solid #5227ff;outline-offset:4px}.ribbon{margin:40px -24px -24px;padding:18px;background:#5227ff;font-weight:900;transform:rotate(-2deg);font-size:18px}
  </style>
</head>
<body>
  <main>
    <p class="brand">Le Comptoir des Étuves</p>
    <div class="stamp" aria-hidden="true">404</div>
    <h1 id="heading">Cette page s'est fait dévorer.</h1>
    <p id="description">Le lien est introuvable, mais notre carte est toujours là.</p>
    <nav class="actions" aria-label="Retour au site">
      <a id="menu" href="/?lang=fr#menu">Voir notre carte</a>
      <a id="home" href="/?lang=fr">Retour à l’accueil</a>
    </nav>
    <div class="ribbon" aria-hidden="true">WRAPS ✦ BURGERS ✦ TACOS ✦ SANDWICHS</div>
  </main>
  <script>
    const locale = (navigator.languages?.[0] || navigator.language || 'fr').toLowerCase();
    const lang = locale.startsWith('fr') ? 'fr' : /^(es|ca|eu|gl)/.test(locale) ? 'es' : 'en';
    const text = {
      fr: ["Cette page s'est fait dévorer.", 'Le lien est introuvable, mais notre carte est toujours là.', 'Voir notre carte', 'Retour à l’accueil'],
      en: ['This page got eaten.', 'This link cannot be found, but our menu is still here.', 'View our menu', 'Back home'],
      es: ['Alguien se ha comido esta página.', 'No encontramos este enlace, pero nuestra carta sigue aquí.', 'Ver nuestra carta', 'Volver al inicio']
    }[lang];
    document.documentElement.lang = lang;
    ['heading', 'description', 'menu', 'home'].forEach((id,i) => document.getElementById(id).textContent = text[i]);
    const project = '/' + location.pathname.split('/').filter(Boolean)[0] + '/';
    const base = location.hostname.endsWith('github.io') ? project : location.protocol === 'file:' ? './' : '/';
    const home = base + (lang === 'fr' ? 'index.html?lang=fr' : lang + '/index.html');
    document.getElementById('home').href = home;
    document.getElementById('menu').href = home + '#menu';
  </script>
</body>
</html>
